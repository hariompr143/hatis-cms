name: CI

# Pull-request and branch pipeline.
#
#   source -> format/lint -> unit test -> integration test -> SAST
#          -> dependency scan -> secret scan -> build -> container scan
#          -> SBOM -> artifact
#
# Production deployment is a separate, manually approved workflow (release.yml).

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/hatis-platform

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
            infra:
              - 'deploy/**'
              - 'terraform/**'

  backend:
    name: Backend (Java 21 / Spring Boot)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify (enforce, compile, unit tests, integration tests)
        run: mvn -B -ntp -e verify 2>&1 | tee /tmp/mvn.log

      # Raw job logs are not always reachable from every environment, so publish
      # the tail of a failed build as a commit comment.
      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Backend build failed (\`${GITHUB_SHA::7}\`)"
            echo '```'
            grep -E "ERROR|BUILD FAILURE|Tests run:|\[INFO\] Building |Caused by" /tmp/mvn.log | tail -n 180
            echo '```'
          } > /tmp/body.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/body.md)" >/dev/null

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/target/*-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/**/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend (Next.js / TypeScript)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: semgrep ci --config auto --config .semgrep.yml --metrics off
        env:
          SEMGREP_RULES: p/owasp-top-ten p/java p/security-audit

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: OWASP dependency-check (backend)
        working-directory: backend
        run: mvn -B -ntp -DskipTests org.owasp:dependency-check-maven:10.0.4:aggregate || true
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          if-no-files-found: ignore

  iac:
    name: IaC validation
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: helm lint
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint deploy/helm/hatis-platform
          helm template hatis deploy/helm/hatis-platform > /tmp/rendered.yaml
      - name: terraform validate
        run: |
          curl -fsSL -o tf.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          unzip -q tf.zip && sudo mv terraform /usr/local/bin/
          for d in terraform/modules/*; do
            (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done

  image:
    name: Build and scan container image
    needs: backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build runtime jar
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.platform
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/hatis-platform.tar

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: /tmp/hatis-platform.tar
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: /tmp/hatis-platform.tar
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Push image (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.platform
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
