{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hatis.serviceAccountName" . }}
  labels:
    {{- include "hatis.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.createDeployerRole }}
{{- end }}
{{- if .Values.serviceAccount.createDeployerRole }}
---
# Least-privilege role for scheduling tenant workloads. Deliberately excludes
# RBAC, CRD, node, cluster-scoped and secret-reading verbs outside the namespaces
# the platform manages.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hatis.fullname" . }}-deployer
  labels:
    {{- include "hatis.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services, configmaps, pods, pods/log, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hatis.fullname" . }}-deployer
  labels:
    {{- include "hatis.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hatis.fullname" . }}-deployer
subjects:
  - kind: ServiceAccount
    name: {{ include "hatis.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
