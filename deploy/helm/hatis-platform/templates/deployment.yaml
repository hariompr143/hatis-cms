apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hatis.fullname" . }}
  labels:
    {{- include "hatis.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.platform.autoscaling.enabled }}
  replicas: {{ .Values.platform.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take capacity away before the replacement is ready.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "hatis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "hatis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret-check.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "hatis.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 45
      containers:
        - name: platform
          image: {{ include "hatis.image" . }}
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          {{- include "hatis.containerCommon" (dict "ctx" . "role" "api" "resources" .Values.platform.resources) | nindent 10 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: work
          emptyDir: { sizeLimit: 1Gi }
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "hatis.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hatis.fullname" . }}-worker
  labels:
    {{- include "hatis.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "hatis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "hatis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "hatis.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: {{ include "hatis.image" . }}
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          {{- include "hatis.containerCommon" (dict "ctx" . "role" "worker" "resources" .Values.worker.resources) | nindent 10 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: work
          emptyDir: { sizeLimit: 4Gi }
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
