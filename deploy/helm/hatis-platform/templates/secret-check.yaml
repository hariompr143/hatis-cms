{{/*
Renders only the *name* of the referenced Secret so the pod template checksum
changes when the reference changes. The chart never contains secret material:
the Secret itself is created by the installer from the customer's secret store.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hatis.fullname" . }}-config
  labels:
    {{- include "hatis.labels" . | nindent 4 }}
data:
  secret-ref: {{ include "hatis.secretName" . | quote }}
  event-transport: {{ .Values.events.transport | quote }}
  secrets-provider: {{ .Values.secretsProvider | quote }}
  database-external: {{ .Values.database.external | quote }}
