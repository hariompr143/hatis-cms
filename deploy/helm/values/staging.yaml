# Staging overrides for the HATIS platform chart.
#
# Staging mirrors production's shape at a smaller scale so that a problem in
# staging is a problem you would have had in production.

platform:
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits:   { cpu: "1",  memory: 1536Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

worker:
  replicaCount: 1

ingress:
  enabled: true
  host: api.staging.hatis.example

certificate:
  enabled: true
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer

networkPolicy:
  enabled: true

# -- Installation profile. Anything other than `development` makes the chart refuse
# to render a development-only adapter.
profile: staging

assets:
  scanner:
    mode: clamav
    clamav:
      # ClamAV runs as its own deployment in the platform namespace so scanned bytes
      # never leave the cluster. See docs/architecture/16-observability.md for the
      # scan metrics this deployment is expected to publish.
      host: clamav
      port: 3310
      timeoutMillis: 120000

storage:
  provider: s3
  s3:
    bucket: hatis-staging-assets
    region: us-east-1

# Email is left off in staging for the same reason it is off in production: there is no
# mail relay for it to point at, and naming one here would describe infrastructure that
# does not exist. The chart's email-enabled branch is not left unverified for that
# reason — CI renders it explicitly with `--set notification.email.enabled=true` and
# asserts the SMTP variable is mounted under the name the secret-store path derives.
# Enabling it for a real install means setting `enabled`, `host` and `username` here and
# adding an `smtp-password` key to the installation Secret.
notification:
  email:
    enabled: false

analytics:
  # Staging evaluates more often than production so a misfiring rule is noticed in
  # minutes rather than in an hour.
  alertInterval: 30s
